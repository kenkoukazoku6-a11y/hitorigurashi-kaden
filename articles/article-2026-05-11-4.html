<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一人暮らしにおすすめの電気鍋4選【2024年版】コンパクトで多機能な人気モデルを比較</title>
  <meta name="description" content="一人暮らしにぴったりな電気鍋のおすすめ4選を徹底比較！コンパクトサイズで多機能、使いやすさ重視のモデルを価格帯別に紹介します。鍋料理・煮込み・蒸し料理も一台でOK。">
  <style>
    /* ===== リセット & ベース ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      font-size: 16px;
      line-height: 1.8;
      color: #333;
      background-color: #f5f9f5;
    }
    a { color: #2e7d32; text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; height: auto; }

    /* ===== ヘッダー ===== */
    header {
      background: linear-gradient(135deg, #1b5e20, #388e3c);
      color: #fff;
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .site-name {
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.05em;
    }
    .site-name a { color: #fff; }
    .breadcrumb {
      font-size: 0.78rem;
      color: #c8e6c9;
    }
    .breadcrumb a { color: #c8e6c9; }
    .breadcrumb a:hover { color: #fff; }

    /* ===== メインレイアウト ===== */
    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px 40px;
    }

    /* ===== タイトルエリア ===== */
    .page-title-area {
      background: #fff;
      border-left: 6px solid #388e3c;
      border-radius: 4px;
      padding: 24px 24px 20px;
      margin-bottom: 32px;
      box-shadow: 0 2px 8px rgba(56,142,60,0.08);
    }
    h1 {
      font-size: 1.55rem;
      color: #1b5e20;
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .page-meta {
      font-size: 0.8rem;
      color: #777;
    }
    .intro-text {
      margin-top: 14px;
      font-size: 0.97rem;
      color: #444;
    }

    /* ===== セクション共通 ===== */
    section { margin-bottom: 48px; }
    h2 {
      font-size: 1.25rem;
      color: #fff;
      background: linear-gradient(90deg, #2e7d32, #66bb6a);
      padding: 10px 18px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    h3 {
      font-size: 1.05rem;
      color: #1b5e20;
      border-bottom: 2px solid #a5d6a7;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    /* ===== 商品カード ===== */
    .product-card {
      background: #fff;
      border: 1px solid #c8e6c9;
      border-radius: 10px;
      padding: 22px;
      margin-bottom: 24px;
      box-shadow: 0 2px 10px rgba(56,142,60,0.07);
      transition: box-shadow 0.2s;
    }
    .product-card:hover { box-shadow: 0 4px 18px rgba(56,142,60,0.18); }
    .product-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 14px;
    }
    .rank-badge {
      background: #388e3c;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .rank-badge.gold   { background: #f9a825; }
    .rank-badge.silver { background: #757575; }
    .rank-badge.bronze { background: #6d4c41; }
    .rank-badge.pick   { background: #00838f; }
    .product-name { font-size: 1.05rem; font-weight: bold; color: #222; }
    .product-img-placeholder {
      width: 100%;
      height: 160px;
      background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #388e3c;
      font-size: 0.85rem;
      margin-bottom: 14px;
    }
    .product-features {
      list-style: none;
      margin-bottom: 14px;
    }
    .product-features li {
      padding: 4px 0;
      font-size: 0.92rem;
      display: flex;
      gap: 8px;
    }
    .product-features li::before { content: "✅"; flex-shrink: 0; }
    .price-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .price-label { font-size: 0.8rem; color: #777; }
    .price-value { font-size: 1.2rem; font-weight: bold; color: #c62828; }
    .amazon-btn {
      display: inline-block;
      background: linear-gradient(135deg, #ff9900, #ffb300);
      color: #111;
      font-weight: bold;
      font-size: 0.92rem;
      padding: 10px 22px;
      border-radius: 6px;
      transition: opacity 0.2s;
    }
    .amazon-btn:hover { opacity: 0.85; text-decoration: none; }

    /* ===== こんな人向け ===== */
    .target-badge {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 0.8rem;
      padding: 3px 10px;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    /* ===== 比較表 ===== */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      min-width: 560px;
    }
    thead tr { background: #2e7d32; color: #fff; }
    thead th { padding: 10px 12px; text-align: center; }
    tbody tr:nth-child(even) { background: #f1f8e9; }
    tbody tr:nth-child(odd)  { background: #fff; }
    tbody td { padding: 10px 12px; text-align: center; border-bottom: 1px solid #dcedc8; }
    tbody td:first-child { text-align: left; font-weight: bold; }
    .check { color: #388e3c; font-weight: bold; }
    .cross { color: #aaa; }

    /* ===== 選び方ガイド ===== */
    .guide-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    .guide-card {
      background: #fff;
      border: 1px solid #c8e6c9;
      border-radius: 8px;
      padding: 16px;
    }
    .guide-card h3 {
      font-size: 0.95rem;
      margin-bottom: 8px;
    }
    .guide-card p { font-size: 0.88rem; color: #555; }

    /* ===== まとめ ===== */
    .summary-box {
      background: #e8f5e9;
      border: 1px solid #a5d6a7;
      border-radius: 8px;
      padding: 20px 24px;
    }
    .summary-box p { font-size: 0.95rem; margin-bottom: 8px; }

    /* ===== フッター ===== */
    footer {
      background: #1b5e20;
      color: #c8e6c9;
      padding: 24px 16px;
      font-size: 0.78rem;
      text-align: center;
      line-height: 1.9;
    }
    footer a { color: #a5d6a7; }
    .disclaimer {
      background: #154a1a;
      border-radius: 6px;
      padding: 12px 16px;
      max-width: 700px;
      margin: 10px auto 0;
      text-align: left;
    }

    /* ===== レスポンシブ ===== */
    @media (max-width: 600px) {
      h1 { font-size: 1.2rem; }
      h2 { font-size: 1.05rem; }
      .product-img-placeholder { height: 120px; }
      .price-value { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
