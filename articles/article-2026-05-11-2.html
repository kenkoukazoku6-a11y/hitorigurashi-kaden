<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一人暮らし向けスティック掃除機おすすめ5選【2024年最新】コンパクトで使いやすい人気モデルを徹底比較</title>
  <meta name="description" content="一人暮らしにぴったりなスティック掃除機のおすすめ5選を紹介。軽量・コンパクト・収納しやすいモデルを価格帯別に比較。アパートや1Kでも使いやすい人気商品をランキング形式で解説します。">
  <style>
    /* ===== リセット & 基本設定 ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      font-size: 16px;
      line-height: 1.8;
      color: #333;
      background-color: #f5f9f5;
    }
    a { color: #2e7d32; text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; height: auto; }

    /* ===== ヘッダー ===== */
    header {
      background: linear-gradient(135deg, #1b5e20, #43a047);
      color: #fff;
      padding: 16px 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .site-name {
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.05em;
    }
    .site-name a { color: #fff; }
    .breadcrumb {
      font-size: 0.78rem;
      color: #c8e6c9;
    }
    .breadcrumb a { color: #c8e6c9; }

    /* ===== メインレイアウト ===== */
    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px 40px;
    }

    /* ===== ページタイトル ===== */
    .page-title-wrap {
      background: #fff;
      border-left: 6px solid #43a047;
      border-radius: 4px;
      padding: 20px 24px;
      margin-bottom: 28px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 1.55rem;
      font-weight: bold;
      color: #1b5e20;
      line-height: 1.5;
    }
    .update-date {
      font-size: 0.8rem;
      color: #888;
      margin-top: 8px;
    }

    /* ===== セクション共通 ===== */
    section { margin-bottom: 40px; }
    h2 {
      font-size: 1.25rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(90deg, #2e7d32, #66bb6a);
      padding: 10px 18px;
      border-radius: 4px;
      margin-bottom: 18px;
    }
    h3 {
      font-size: 1.05rem;
      font-weight: bold;
      color: #1b5e20;
      border-bottom: 2px solid #a5d6a7;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }
    p { margin-bottom: 12px; }

    /* ===== リード文ボックス ===== */
    .lead-box {
      background: #e8f5e9;
      border: 1px solid #a5d6a7;
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 28px;
      font-size: 0.97rem;
    }

    /* ===== チェックリスト ===== */
    .check-list { list-style: none; padding: 0; }
    .check-list li {
      padding: 6px 0 6px 28px;
      position: relative;
      border-bottom: 1px dashed #c8e6c9;
    }
    .check-list li:last-child { border-bottom: none; }
    .check-list li::before {
      content: '✓';
      position: absolute;
      left: 0;
      color: #43a047;
      font-weight: bold;
    }

    /* ===== 商品カード ===== */
    .product-card {
      background: #fff;
      border: 1px solid #c8e6c9;
      border-radius: 10px;
      padding: 22px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transition: box-shadow 0.2s;
    }
    .product-card:hover { box-shadow: 0 4px 16px rgba(46,125,50,0.15); }
    .product-rank {
      display: inline-block;
      background: #43a047;
      color: #fff;
      font-size: 0.78rem;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .product-rank.rank1 { background: #f9a825; }
    .product-rank.rank2 { background: #78909c; }
    .product-rank.rank3 { background: #8d6e63; }
    .product-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 12px 0;
    }
    .badge {
      font-size: 0.78rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: bold;
    }
    .badge-price  { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .badge-weight { background: #fff8e1; color: #f57f17; border: 1px solid #ffe082; }
    .badge-time   { background: #e3f2fd; color: #1565c0; border: 1px solid #90caf9; }
    .product-features { margin: 10px 0; }
    .product-features li {
      font-size: 0.92rem;
      padding: 4px 0 4px 20px;
      position: relative;
      color: #444;
    }
    .product-features li::before {
      content: '▶';
      position: absolute;
      left: 0;
      color: #66bb6a;
      font-size: 0.7rem;
      top: 7px;
    }
    .amazon-btn {
      display: inline-block;
      background: linear-gradient(135deg, #ff9800, #f57c00);
      color: #fff !important;
      font-weight: bold;
      padding: 11px 24px;
      border-radius: 6px;
      font-size: 0.95rem;
      margin-top: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: opacity 0.2s;
    }
    .amazon-btn:hover { opacity: 0.88; text-decoration: none; }

    /* ===== 比較表 ===== */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      min-width: 560px;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    th {
      background: #2e7d32;
      color: #fff;
      padding: 11px 12px;
      text-align: center;
      font-weight: bold;
    }
    td {
      padding: 10px 12px;
      text-align: center;
      border-bottom: 1px solid #e0e0e0;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) td { background: #f1f8e9; }
    .best-mark { color: #f57f17; font-weight: bold; }

    /* ===== 選び方ボックス ===== */
    .tip-box {
      background: #fff;
      border: 2px solid #a5d6a7;
      border-radius: 10px;
      padding: 20px;
    }
    .tip-box h3 { margin-top: 16px; }
    .tip-box h3:first-child { margin-top: 0; }

    /* ===== まとめ ===== */
    .summary-box {
      background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
      border: 1px solid #a5d6a7;
      border-radius: 10px;
      padding: 22px;
    }

    /* ===== フッター ===== */
    footer {
      background: #1b5e20;
      color: #c8e6c9;
      text-align: center;
      padding: 24px 16px;
      font-size: 0.78rem;
      line-height: 1.9;
    }
    footer a { color: #a5d6a7; }
    .disclaimer {
      background: #2e7d32;
      border-radius: 6px;
      padding: 12px 16px;
      margin: 12px auto;
      max-width: 700px;
      font-size: 0.75rem;
      color: #c8e6c9;
    }

    /* ===== レスポンシブ ===== */
    @media (max-width: 600px) {
      h1 { font-size: 1.2rem; }
      h2 { font-size: 1.1rem; }
      .header-inner { flex-direction: column; align-items: flex-start; }
      .product-card { padding: 16px; }
      .amazon-btn { display: block; text-align: center; }
    }
  </style>
</head>
<body>
