<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | 一人暮らし家電ガイド</title>
  <meta name="description" content="一人暮らし家電ガイドへのお問い合わせはこちらから。記事の内容・掲載依頼・その他ご質問をお気軽にどうぞ。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1560a8;
      --primary-dark: #0d4a8a;
      --accent: #ff6b35;
      --bg: #f4f6f9;
      --white: #ffffff;
      --text: #2d2d2d;
      --text-light: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif; background: var(--bg); color: var(--text); line-height: 1.8; }

    header { background: var(--white); border-bottom: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; height: 64px; gap: 16px; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-icon { width: 36px; height: 36px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .logo-text { font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.2; }
    .logo-text span { display: block; font-size: 0.68rem; font-weight: 400; color: var(--text-light); }
    .back-btn { margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px; text-decoration: none; font-size: 0.82rem; color: var(--text-light); transition: background 0.15s; }
    .back-btn:hover { background: var(--bg); }

    .page-hero { background: linear-gradient(135deg, #1560a8, #0d4a8a); color: white; padding: 40px 20px; }
    .page-hero-inner { max-width: 860px; margin: 0 auto; }
    .page-hero h1 { font-size: 1.6rem; font-weight: 700; }
    .page-hero p { font-size: 0.85rem; opacity: 0.75; margin-top: 8px; }

    .content-wrap { max-width: 680px; margin: 0 auto; padding: 40px 20px 60px; }

    .notice-box { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: var(--radius); padding: 16px 20px; margin-bottom: 28px; font-size: 0.88rem; color: #1e40af; }
    .notice-box p + p { margin-top: 6px; }

    .form-card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 32px 36px; }

    .form-group { margin-bottom: 22px; }
    .form-group label { display: block; font-size: 0.88rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .form-group label .required { color: #ef4444; font-size: 0.78rem; margin-left: 4px; }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.93rem;
      font-family: inherit;
      color: var(--text);
      background: var(--white);
      transition: border-color 0.15s;
      outline: none;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(21,96,168,0.1); }
    .form-group textarea { resize: vertical; min-height: 140px; }

    .submit-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 3px 12px rgba(21,96,168,0.3);
    }
    .submit-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }

    .privacy-note { font-size: 0.78rem; color: var(--text-light); text-align: center; margin-top: 14px; }
    .privacy-note a { color: var(--primary); text-decoration: none; }

    footer { background: #1a2744; color: #9ca3af; margin-top: 20px; }
    .footer-bottom { max-width: 1100px; margin: 0 auto; padding: 20px; text-align: center; font-size: 0.75rem; }
    .footer-bottom a { color: #6b7280; text-decoration: none; }

    @media (max-width: 600px) {
      .form-card { padding: 24px 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo">
      <div class="logo-icon">🏠</div>
      <div class="logo-text">一人暮らし家電ガイド<span>コンパクト家電を徹底比較</span></div>
    </a>
    <a href="index.html" class="back-btn">← トップへ戻る</a>
  </div>
</header>

<div class="page-hero">
  <div class="page-hero-inner">
    <h1>お問い合わせ</h1>
    <p>記事の内容・ご質問・その他お気軽にご連絡ください</p>
  </div>
</div>

<div class="content-wrap">

  <div class="notice-box">
    <p>お問い合わせ内容を確認後、通常3営業日以内にご返信いたします。</p>
    <p>内容によってはご回答が難しい場合や、お時間をいただく場合がございます。あらかじめご了承ください。</p>
  </div>

  <div class="form-card">
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <div class="form-group">
        <label for="name">お名前<span class="required">必須</span></label>
        <input type="text" id="name" name="name" placeholder="例：山田 太郎" required>
      </div>

      <div class="form-group">
        <label for="email">メールアドレス<span class="required">必須</span></label>
        <input type="email" id="email" name="email" placeholder="例：example@email.com" required>
      </div>

      <div class="form-group">
        <label for="category">お問い合わせ種別<span class="required">必須</span></label>
        <select id="category" name="category" required>
          <option value="" disabled selected>選択してください</option>
          <option value="article">記事の内容について</option>
          <option value="product">掲載商品について</option>
          <option value="affiliate">アフィリエイト・掲載依頼</option>
          <option value="other">その他</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">お問い合わせ内容<span class="required">必須</span></label>
        <textarea id="message" name="message" placeholder="お問い合わせ内容をご記入ください。" required></textarea>
      </div>

      <button type="submit" class="submit-btn">送信する</button>
      <p class="privacy-note">送信された情報は<a href="privacy.html">プライバシーポリシー</a>に基づき適切に管理します。</p>
    </form>
  </div>

</div>

<footer>
  <div class="footer-bottom">
    <p>&copy; 2026 一人暮らし家電ガイド &nbsp;|&nbsp; 本サイトはAmazonアソシエイトとして適格販売により収入を得ています。&nbsp;|&nbsp; <a href="privacy.html">プライバシーポリシー</a> &nbsp;|&nbsp; <a href="contact.html">お問い合わせ</a></p>
  </div>
</footer>

</body>
</html>
