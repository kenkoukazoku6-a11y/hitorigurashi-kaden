name: 自動記事生成

on:
  workflow_dispatch:      # 手動実行のみ

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Anthropic SDKをインストール
        run: npm install @anthropic-ai/sdk

      - name: 記事を生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node generate-article.js

      - name: GitHubにコミット・プッシュ
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Auto Article Bot"
          git add articles/ index.html sitemap.xml scripts/topic-state.json
          git diff --staged --quiet || git commit -m "自動記事生成: $(date +'%Y-%m-%d')"
          git push
